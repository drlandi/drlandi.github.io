<footer class="site-footer">
  <div class="wrap">
    <span>&copy; {{ now.Year }} {{ site.Params.name }}</span>
    <span class="links">
      {{ partial "email.html" . }}
      <a href="{{ site.Params.github }}" target="_blank" rel="noopener">github</a>
      {{ with site.Params.whatsapp }}<a href="https://wa.me/{{ . }}" target="_blank" rel="noopener">whatsapp</a>{{ end }}
      {{ with site.Params.linkedin }}<a href="{{ . }}" target="_blank" rel="noopener">linkedin</a>{{ end }}
    </span>
  </div>
</footer>
<script>
document.querySelectorAll('.copy-email').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var done = function () {
      btn.textContent = btn.dataset.copied;
      setTimeout(function () { btn.textContent = btn.dataset.label; }, 1800);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(btn.dataset.email).then(done);
    } else {
      var t = document.createElement('textarea');
      t.value = btn.dataset.email;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
      done();
    }
  });
});
</script>
